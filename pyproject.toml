[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplyguard"
version = "0.1.0"
description = "Pre-install typosquatting and slopsquatting detector for Python dependencies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
supplyguard = "supplyguard.cli:main"

[tool.setuptools]
packages = ["supplyguard"]

[tool.setuptools.package-data]
supplyguard = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
