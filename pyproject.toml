[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplyguard"
version = "0.2.0"
description = "Pre-install typosquatting and slopsquatting detector for Python dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SupplyGuard contributors" }]
keywords = ["security", "supply-chain", "typosquatting", "slopsquatting", "pypi", "dependencies"]
dependencies = []  # standard library only
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3"]

[project.scripts]
supplyguard = "supplyguard.cli:main"

[tool.setuptools]
packages = ["supplyguard"]

[tool.setuptools.package-data]
supplyguard = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
