name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  eval:
    name: Offline evaluation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run sampled evaluation
        run: |
          python eval/run_eval.py \
            --limit-pos 300 --limit-neg 150 --seed 420 \
            --json eval/results/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/ci.json
          if-no-files-found: error

  scan-demo:
    name: SARIF scan demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Scan the demo requirements
        run: |
          supplyguard scan examples/requirements-demo.txt \
            --offline --fail-on none \
            --json supplyguard.json --sarif supplyguard.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: supplyguard-report
          path: |
            supplyguard.json
            supplyguard.sarif
      # Requires GitHub code scanning to be enabled for the repository.
      # continue-on-error keeps forks/private repos without it green.
      - name: Upload SARIF
        if: github.event_name == 'push'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: supplyguard.sarif
